name: Temperature Converter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Static Type Checker (mypy)
        run: python -m mypy temperature_converter.py main.py

      - name: Run Unit Tests (pytest)
        run: python -m pytest test_temperature_converter.py -v --cov=temperature_converter --cov-report=term-missing
